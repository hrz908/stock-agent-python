# 本地开发依赖：PostgreSQL(pgvector) + Redis [+ Ingest]
#
#   docker compose up -d                       # 启动核心依赖（pg/redis）
#   docker compose --profile ingest up -d      # 附带启动文档 ingest 服务
#   docker compose down                        # 停掉（数据保留在卷里）
#   docker compose down -v                     # 连数据一起清掉
#
# 网关与 agent 已合并为同一个 Python 进程，跑在宿主机而不是容器里：
#   bash scripts/dev.sh dev        # = uvicorn server.main:app --port 8080
# 所以本文件不再包含 agent / server 服务，只提供它们依赖的中间件。
#
# 端口映射到宿主机，与 server/config.py 的默认 DSN / Redis 地址一致：
#   postgres://postgres:postgres@localhost:5432/stock_agent?sslmode=disable
#   127.0.0.1:6379
#
# 说明：
#   postgres 镜像使用 pgvector/pgvector:pg16（内置 vector 扩展），
#   migrations/005_agent.sql 里的 CREATE EXTENSION vector 依赖此镜像。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stock-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_agent
      TZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅首次初始化（数据目录为空时）执行，之后改表请用新的迁移文件
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stock_agent']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: stock-agent-redis
    # 与生产一致：缓存总量封顶，避免全量灌库时把内存吃光
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

  ingest:
    build:
      context: ../ingest
      dockerfile: Dockerfile
    container_name: stock-agent-ingest
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stock_agent?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WATCH_DIR: /data/docs
      OFFLINE_EMBED_MODEL: ${OFFLINE_EMBED_MODEL:-Qwen/Qwen3-Embedding-4B}
      EMBED_DIM: ${EMBED_DIM:-1536}
      # ingest 默认未装 FlagEmbedding，会走 OpenAI 兼容降级路径，故必须给齐下面几项；
      # 离线模型与输出维度要和 agent 的 ONLINE_EMBED_MODEL / EMBED_DIM 一致，否则向量空间不匹配
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.siliconflow.cn/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ingestdata:/data/docs
      # 解析副本：原件淘汰后 reembed 的唯一依据
      - parseddata:/data/parsed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - ingest

volumes:
  pgdata:
  redisdata:
  ingestdata:
  parseddata:
