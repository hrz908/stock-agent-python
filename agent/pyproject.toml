# 只放工具配置，不放 [project] / [build-system]。
# 原因：agent 的镜像是 Dockerfile 里 `pip install -r requirements.txt` + `COPY . .`，
# 一旦声明 [project]，pip 会把它当成可安装包处理，反而干扰构建。

[tool.ruff]
line-length = 100
# 与 Dockerfile 的 python:3.11-slim 对齐
target-version = "py311"
extend-exclude = ["__pycache__", "*.pyc"]

[tool.ruff.lint]
# ASYNC 抓 async/await 误用（LangGraph 节点里最常见）
# B   = bugbear（可变默认参数、重复 try 等）
# I   = import 排序，替代 isort
# UP  = 语法现代化提示
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# 测试 / 压测脚本：长行、同步文件 IO 都在一次性脚本里，为它们拆线程或硬换行没有收益
"tests/**" = ["E501", "ASYNC109", "ASYNC230", "ASYNC240", "UP031"]
# call_tool_safe 的 timeout 参数是对外 API（工具层统一传超时），不是内部实现细节
"tools/__init__.py" = ["ASYNC109"]

[tool.ruff.format]
quote-style = "double"

# Pylance / pyright
[tool.pyright]
pythonVersion = "3.11"
# 项目没有类型标注，先从 basic 起步；reportMissingImports 是重点：
# LangGraph / LangChain 的字段名拼错、不存在的模块导入主要靠它抓
typeCheckingMode = "basic"
reportMissingImports = true
exclude = ["__pycache__"]
