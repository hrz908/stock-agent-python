# StockA 生产反代（tearsinrain.top + Let's Encrypt）
#
# 安装（scripts/deploy.sh deploy 会自动做）：
#   cp deploy/nginx.prod.conf /etc/nginx/conf.d/stock-agent.conf
#   rm -f /etc/nginx/sites-enabled/default     # 去掉 Ubuntu 默认站，避免 80 端口抢占
#   nginx -t && systemctl reload nginx
#
# 证书：deploy.sh 首次部署会在 /etc/nginx/ssl/ 生成自签证书占位。生产用 acme.sh
# 以 DNS-01 签发 Let's Encrypt（HTTP-01 会被 DNSPod 上指向 EdgeOne 的分线路解析挡掉，
# 那边返回 418），再覆盖同名文件；路径不变，所以本文件不用跟着改：
#   /root/.acme.sh/acme.sh --issue --dns dns_tencent -d tearsinrain.top --server letsencrypt
#   /root/.acme.sh/acme.sh --install-cert -d tearsinrain.top \
#     --key-file /etc/nginx/ssl/stock-agent.key \
#     --fullchain-file /etc/nginx/ssl/stock-agent.crt \
#     --reloadcmd "systemctl reload nginx"
# 续期由 acme.sh 安装的 cron 完成，触发 install-cert 的 reloadcmd 自动生效。
#
# 代理规则与本地开发版 deploy/nginx.conf 一致（WebSocket / SSE / 普通 API 分流），
# 差异：443 + TLS、WebSocket 限流 zone、上传体积放大到 20m、去掉 agent-internal
# （agent 容器不对宿主暴露端口，调试请用 docker compose exec）。

upstream gin_up {
    server 127.0.0.1:8080;
}

# WebSocket 连接限流 zone
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

# ---- 80：ACME 验证入口（当前证书走 DNS-01，这里保留给 HTTP-01 备用），其余跳 HTTPS ----
server {
    listen 80;
    server_name tearsinrain.top;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tearsinrain.top;

    # 证书文件由 deploy.sh 生成自签占位、acme.sh 覆盖为 Let's Encrypt（见文件头），
    # 两种来源路径相同，换 CA 不需要改这里。
    ssl_certificate     /etc/nginx/ssl/stock-agent.crt;
    ssl_certificate_key /etc/nginx/ssl/stock-agent.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    # 证书已是 Let's Encrypt 且由 acme.sh 自动续期，可以放心让浏览器记住 HTTPS。
    # 不加 includeSubDomains：本域名下的子域不一定都上了 TLS。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 语音上传（ASR 音频）放宽请求体上限
    client_max_body_size 20m;

    # 普通 API：保持默认缓冲
    location /api/ {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # 健康检查（探活/部署验证用）
    location /healthz {
        proxy_pass http://gin_up;
    }

    # 静态资源
    location /uploads/ {
        proxy_pass http://gin_up;
    }

    # WebSocket（小程序主链路）
    location /api/v1/ws/agent {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        gzip off;
        limit_conn ws_per_ip 20;
    }

    # 旧版 WebSocket（提醒推送）
    location /api/v1/ws {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        gzip off;
    }

    # SSE（H5 兼容链路）
    location /api/v1/agent/stream {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-transform";
        # 本块出现 add_header 后不再继承 server 级的安全头，需重复声明
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
