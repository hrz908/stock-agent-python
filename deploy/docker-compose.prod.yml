# 生产部署编排（服务器上用这个，别用 server/docker-compose.yml——那是本地开发版）
#
#   cd deploy
#   cp .env.production.example .env   # 填好密钥
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f server
#
# 与本地开发版的差异：
#   - Go server 也进 compose 网络（容器名 server），agent 回调地址为 http://server:8080，
#     不再是 host.docker.internal；
#   - postgres / redis 不映射宿主端口，只有同网络的容器能访问；
#   - server 的 8080 只绑 127.0.0.1，对外的 HTTPS/WSS 统一走宿主机 nginx（deploy/nginx.prod.conf）；
#   - 全部服务 restart: unless-stopped，开机自愈。
#
# 数据库位置由 .env 的 DATABASE_DSN 决定：留空=用本文件的 postgres 服务（带 localpg profile，
# deploy.sh 会自动加 --profile localpg）；填云 PG 内网串=整套服务连云上、postgres 不再启动。
# 手工直接敲 docker compose 时要自己补 --profile localpg，否则不会起数据库。
#
# .env 变量说明见 .env.production.example。

# 日志限额：docker 默认 json-file 无上限，agent/ashare 常驻，40GB 盘会被慢慢吃满。
# 单文件 50MB × 3 份，单服务封顶 150MB；排查历史改用备份/外部日志。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# 禁止容器内提权（setuid 二进制 / capabilities 再获取）：这些服务都只跑单进程，
# 不需要任何提权路径；镜像默认 root，靠这一项兜住「进程被拿走后横向提权」
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

# 内存预算（宿主 3GB / 4 vCPU）：不给上限时任一容器暴涨都会把整机拖到失联，
# 表现为 SSH 卡在 banner exchange、nginx 也不响应。按下面配额封顶：
#   postgres 768M + redis 320M + server 448M + agent 1088M ≈ 2.6G，其余留给系统与 nginx。
# 超限只会被 cgroup 杀掉该容器并 restart，不再拖垮整台机器。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stock-agent-postgres
    <<: *hardening
    restart: unless-stopped
    # 用外部 PG（腾讯云）时不再需要自带容器：DATABASE_DSN 指向外部地址即自动跳过本服务
    # （deploy.sh / backup.sh 按 .env 的 DATABASE_DSN 判断，见脚本里的 compose() 包装）
    profiles:
      - localpg
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: stock_agent
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅数据目录为空时执行一次初始化；之后改表请加新的迁移文件
      - ../server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stock_agent']
      interval: 3s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7-alpine
    container_name: stock-agent-redis
    <<: *hardening
    restart: unless-stopped
    logging: *default-logging
    # maxmemory 是硬约束：embedding 缓存全量攒会涨到 GB 级，且与限流/会话共用同一实例。
    # 不设上限时 noeviction 写满会连登录一起崩；allkeys-lru 淘汰最久未用的，缓存命中
    # 掉了只是重算几分钱。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          # maxmemory 256M + 复制缓冲/连接开销
          memory: 320M

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    container_name: stock-agent-server
    <<: *hardening
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # env_file 已注入全部密钥，这里只放「随部署环境变化」的连接项。
      # 环境变量名 = 配置键大写 + 点转下划线（见 server/internal/config/config.go）
      ENV: prod
      ADDR: ":8080"
      DSN: "${DATABASE_DSN:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/stock_agent?sslmode=disable}"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      # agent 容器名（compose 网络内 DNS）
      AGENT_BASE_URL: "http://agent:8000"
      UPLOAD_DIR: "/app/uploads"
      # nginx 在宿主机、server 在容器里：真实来源是 docker 网桥（172.17.0.1 或 compose 网段），
      # 只信任 127.0.0.1 会拿不到 X-Forwarded-For，全站共用一个 IP 的限流桶
      TRUSTED_PROXIES: "127.0.0.1,172.16.0.0/12"
      # Go 运行时内存闸门：默认 GOGC=100 时堆可涨到存活量 2 倍且不感知宿主上限。
      # GOMEMLIMIT 是软上限（到点加大 GC 频率），留出非堆内存余量后配 448M 硬上限
      GOMEMLIMIT: "320MiB"
      GOGC: "50"
      # 生产不跑 debug 模式（省掉启动时的路由表打印与 pprof 分支）
      GIN_MODE: "release"
    ports:
      # 只绑回环：宿主机 nginx 反代用，不对公网暴露
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
        # 云 PG 模式下 postgres 服务不启用，缺依赖不算失败
        required: false
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 448M

  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: stock-agent-python
    <<: *hardening
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # 留空 DATABASE_DSN 走自带 postgres 容器；填云 PG 内网串则整套服务连云上（见 .env.production.example）
      DATABASE_URL: "${DATABASE_DSN:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/stock_agent?sslmode=disable}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      # 回调 Go 网关：compose 网络内用容器名；token 从 .env 的 GO_SERVER_TOKEN 来
      GO_SERVER_URL: "http://server:8080"
    # 不映射宿主端口：agent 只被 server 容器访问，调试用
    #   docker compose -f docker-compose.prod.yml exec agent curl -s localhost:8000/docs
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 单进程 uvicorn：常驻 250-400M，再留出 akshare/pandas 取数的瞬时峰值
          memory: 1088M


  # 可选：文档 ingest watcher。需要时加 --profile ingest 启动
  ingest:
    build:
      context: ../ingest
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: stock-agent-ingest
    <<: *hardening
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # 留空 DATABASE_DSN 走自带 postgres 容器；填云 PG 内网串则整套服务连云上（见 .env.production.example）
      DATABASE_URL: "${DATABASE_DSN:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/stock_agent?sslmode=disable}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      WATCH_DIR: /data/docs
    volumes:
      - ingestdata:/data/docs
      # 解析副本：原件淘汰后 reembed 的唯一依据，必须落在卷里，否则容器重建即失
      - parseddata:/data/parsed
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    profiles:
      - ingest

  # 可选：A股文本语料采集 + 离线向量化。需要时加 --profile ashare 启动
  #
  # 模型权重不打进镜像：宿主机目录只读挂到 /models，容器内禁网拉取。
  # 首次部署前把模型放到 ${ASHARE_MODEL_DIR}/${ASHARE_MODEL_NAME}，例如
  #   /opt/stock-agent/models/Qwen3-Embedding-4B
  ashare:
    build:
      context: ../ingest
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        # 1 = 镜像内装 torch/sentence-transformers（离线必需）
        INSTALL_EMBED: ${ASHARE_INSTALL_EMBED:-1}
    container_name: stock-agent-ashare
    <<: *hardening
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # 留空 DATABASE_DSN 走自带 postgres 容器；填云 PG 内网串则整套服务连云上（见 .env.production.example）
      DATABASE_URL: "${DATABASE_DSN:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/stock_agent?sslmode=disable}"
      ASHARE_DATA_DIR: /data/ashare
      # 与 agent/ingest 的 embedding 保持同一模型同一维度，否则写入和检索落在两个向量空间
      ASHARE_EMBED_MODEL: ${OFFLINE_EMBED_MODEL:-Qwen/Qwen3-Embedding-4B}
      ASHARE_EMBED_DIM: ${EMBED_DIM:-1536}
      ASHARE_MODEL_PATH: /models/${ASHARE_MODEL_NAME:-Qwen3-Embedding-4B}
      # 没有本地模型权重时走 OpenAI 兼容 embedding API；两者都空才回退本地模型
      ASHARE_EMBED_API_BASE: ${OPENAI_API_BASE:-}
      ASHARE_EMBED_API_KEY: ${OPENAI_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - asharedata:/data/ashare
      - ${ASHARE_MODEL_DIR:-../models}:/models:ro
      # init-db 子命令直接读这份迁移，避免在容器里再造一份 SQL
      - ../server/migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    profiles:
      - ashare

volumes:
  pgdata:
  redisdata:
  uploads:
  ingestdata:
  parseddata:
  asharedata:
